[workspace]
resolver = "2"
members = [
    "crates/citare-core",
    "crates/citare-wasm",
    "crates/citare-data-build",
    "crates/citare-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Polyform-Shield-1.0.0"
repository = "https://github.com/codexpublicus/citare"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
fancy-regex = "0.14"
aho-corasick = "1"

# Tests compile thousands of reporter regexes; an unoptimized regex
# compiler dominated `cargo test` time. Optimize only the regex stack, so
# other dependencies and workspace crates still build quickly.
[profile.dev.package.regex]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2
[profile.dev.package.fancy-regex]
opt-level = 2
[profile.dev.package.aho-corasick]
opt-level = 2
[profile.dev.package.memchr]
opt-level = 2
