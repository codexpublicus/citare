[workspace]
resolver = "2"
members = [
    "crates/citare-core",
    "crates/citare-wasm",
    "crates/citare-data-build",
    "crates/citare-cli",
    "crates/citare-py",
]

[workspace.package]
version = "0.7.5"
edition = "2021"
license = "LicenseRef-PolyForm-Shield-1.0.0"
repository = "https://github.com/codexpublicus/citare"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the Unicode tables the patterns use: \w, \d, \s and \b
# (unicode-perl) and (?i) (unicode-case). No pattern uses \p{..} classes,
# and the other tables (scripts, general categories, ages, segmentation)
# add about 230 KB to a WASM build (codexpublicus/stare#73).
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
fancy-regex = { version = "0.14", default-features = false, features = ["std", "perf"] }
aho-corasick = "1"

# Tests compile thousands of reporter regexes; an unoptimized regex
# compiler dominated `cargo test` time. Optimize only the regex stack, so
# other dependencies and workspace crates still build quickly.
[profile.dev.package.regex]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2
[profile.dev.package.fancy-regex]
opt-level = 2
[profile.dev.package.aho-corasick]
opt-level = 2
[profile.dev.package.memchr]
opt-level = 2
