[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "citare"
description = "citare's legal citation extraction with eyecite's Python API"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-PolyForm-Shield-1.0.0"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    # Not for PyPI: build the wheel from a checkout.
    "Private :: Do Not Upload",
]

[project.urls]
Repository = "https://github.com/codexpublicus/citare"

[dependency-groups]
dev = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "citare._citare"

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../citare-core/src/**/*.rs" },
    { file = "../citare-core/build.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
