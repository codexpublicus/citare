[[divergence]]
test = "test_ResolveTest.py::ResolveTest::test_supra_resolution"
subtest = { call = "checkResolution((0, 'Foo v. Bar, 1 U.S. 1.'), (1, 'Foo v. Bar, 1 U.S. 2.'), (None, 'Foo, supra, at 2.'))" }
reason = "checkResolution finds each citation in its own text, so both full citations start at offset 0 under the same case name, which citare reads as one decision cited in parallel and resolves the supra to it; in one document they would have different case-name offsets, and test_api.py checks that neither short form resolves there"
doc = "docs/divergences.md#supra-after-parallel"

[[divergence]]
test = "test_ResolveTest.py::ResolveTest::test_short_resolution"
subtest = { call = "checkResolution((0, 'Foo v. Bar, 1 U.S. 1.'), (1, 'Foo v. Bar, 1 U.S. 2.'), (None, 'Foo, 1 U.S., at 2.'))" }
reason = "checkResolution finds each citation in its own text, so both full citations start at offset 0 under the same case name, which citare reads as one decision cited in parallel and resolves the short form to it; in one document they would have different case-name offsets, and test_api.py checks that neither short form resolves there"
doc = "docs/divergences.md#supra-after-parallel"

[[divergence]]
test = "test_FindTest.py::FindTest::test_markup_plaintiff_and_antecedent_guesses"
subtest = { q = "this Court.\n  <em>\n   Holm; In Re Carroll’s Estate\n  </em>\n  (1921), 59 Mont. 403, 413." }
reason = "citare takes the year printed between the case name and the volume, 1921; eyecite finds no year"
doc = "docs/divergences.md#year-before-volume"

[[divergence]]
test = "test_FindTest.py::FindTest::test_disambiguate_citations"
subtest = { q = "1 Wash. 1 (1890)" }
reason = "citare finds Wash., as eyecite does, but citare's EDITIONS_LOOKUP lists Wash. Terr. first for 'Wash.', so eyecite's factory (EDITIONS_LOOKUP[reporter][0]) expects Wash. Terr."
doc = "docs/divergences.md#eyecite-suite-bugs"
issue = "https://github.com/codexpublicus/citare/issues/125"
