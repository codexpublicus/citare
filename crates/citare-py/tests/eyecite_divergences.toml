# eyecite's tests that citare's Python API deliberately fails or can't run.
#
# tests/test_eyecite.py runs eyecite's own test suite from the upstream/eyecite submodule
# (upstream/eyecite/tests) against citare. Each entry below is expected to fail: it is marked
# xfail(strict=True), so the run fails if a listed test passes (the divergence is gone; remove
# the entry) as well as when an unlisted test fails (fix citare, or add an entry here and its
# section in docs/divergences.md). The run also fails on an entry that matches no test, or whose
# doc isn't a section of docs/divergences.md.
#
#   test     eyecite's test id under upstream/eyecite/tests: a module ("test_RegexTest.py"),
#            which covers its import and every test in it, or a test
#            ("test_FindTest.py::FindTest::test_find_citations").
#   subtest  optional: only the subtests of that test whose parameters include these values.
#            eyecite's run_test_pairs names each pair by its input, {q = "..."}; checkResolution
#            and checkReferenceResolution calls are subtests too, {call = "checkResolution(...)"}
#            (eyecite_compat/suite.py, SUBTEST_HELPERS). Every tokenizer's run of a pair matches.
#   reason   why citare fails it.
#   doc      the docs/divergences.md section that explains it.
#   issue    optional: the citare issue for a difference that is a bug, not a decision.

[[divergence]]
test = "test_RegexTest.py"
reason = "tests eyecite.regexes with exrex and roman; citare's patterns are in Rust and the Python API doesn't expose them"
doc = "docs/divergences.md#eyecite-suite-internals"

[[divergence]]
test = "test_TokenizeTest.py"
reason = "tests eyecite's token classes, eyecite.regexes and reporters_db; citare's tokenizers don't return tokens to Python"
doc = "docs/divergences.md#eyecite-suite-internals"

