[package]
name = "citare-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Legal citation extraction library — Rust port of eyecite"
repository.workspace = true
homepage = "https://github.com/codexpublicus/citare"
keywords = ["legal", "citation", "nlp", "law", "parser"]
categories = ["text-processing", "parsing"]

[features]
default = ["embedded-data"]
# Compile the reporter/edition/court data bundle into the library. Without
# it, call `citare_core::data::load` with a bundle before finding citations
# (the small WASM build does this; see docs/data-bundle.md).
embedded-data = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
aho-corasick = { workspace = true }
citare-data-build = { path = "../citare-data-build" }
log = "0.4"
dmp = "0.2"
scraper = "0.22"
sha2 = "0.10"
thiserror = "2"

[build-dependencies]
citare-data-build = { path = "../citare-data-build" }
serde_json = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
rstest = "0.25"
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }
