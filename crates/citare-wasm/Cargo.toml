[package]
name = "citare-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for citare legal citation extraction"
repository.workspace = true
homepage = "https://github.com/codexpublicus/citare"
keywords = ["legal", "citation", "wasm", "law", "parser"]
categories = ["text-processing", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["embedded-data"]
# Compile the data bundle into the module. Build with
# `--no-default-features` for a smaller module that loads the bundle at
# runtime with `initData(bytes)`.
embedded-data = ["citare-core/embedded-data"]

[dependencies]
citare-core = { path = "../citare-core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
