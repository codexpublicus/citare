name: Release benchmark

# Benchmarks a release tag and attaches the report to its GitHub release (#35):
# bench-report.md, bench-summary.json and the saved runs (vectors, the stare.pub sample
# and both files of eyecite's comparison sample) as assets, with the headline numbers in
# the release notes.
# release-plz.yml calls it after cutting a release; run it by hand to backfill a
# release, or with publish off to only build the report.
#
# The stare.pub sample is the release's primary corpus and the ten-percent file of
# eyecite's comparison sample its secondary one. The one-percent run is attached too,
# because PR reports compare against it. eyecite's runs come from citation-bench's
# stored ones (bench/baseline.py), so eyecite only runs here when their key misses.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to benchmark
        required: true
        type: string
      publish:
        description: Attach the report to the release
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to benchmark, e.g. v0.4.1
        required: true
        type: string
      publish:
        description: Attach the report to the release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bench-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Runs on the self-hosted homelab runners, so release speeds compare with eyecite's
  # stored runs, which were timed there. Its only triggers are a manual dispatch, which
  # needs write access, and release-plz.yml's call on a push to main; the guard keeps it
  # to those in this repository, so no fork or fork PR reaches the runner or the
  # CITATION_BENCH_DEPLOY_KEY secret.
  bench:
    name: Benchmark ${{ inputs.tag }}
    if: >-
      github.repository == 'codexpublicus/citare'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: homelab
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/citation-bench
      CITARE_PATH: ${{ github.workspace }}/citare
      CITARE_LABEL: citare-${{ inputs.tag }}
      # The adapter's Cargo.toml names citare by its git URL, and cargo fetches that
      # source even when CITARE_PATH patches it with the tag's checkout.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/codexpublicus/citare.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/codexpublicus/citare
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' isn't a vX.Y.Z tag"; exit 1; }

      # The pin comes from the workflow's own commit, not the tag's: an older tag may
      # predate the report, or pin a citation-bench without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: .github
          persist-credentials: false

      - uses: ./ci/.github/actions/homelab-setup

      - name: Read the citation-bench pin
        id: pin
        run: |
          ref=$(grep -v '^#' ci/.github/citation-bench-ref | tr -d '[:space:]')
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.github/citation-bench-ref isn't a full SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: citare
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codexpublicus/citation-bench
          ref: ${{ steps.pin.outputs.ref }}
          ssh-key: ${{ secrets.CITATION_BENCH_DEPLOY_KEY }}
          persist-credentials: false
          path: citation-bench

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          working_directory: citation-bench

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            citation-bench/target
          key: ${{ runner.os }}-homelab-parity-${{ steps.pin.outputs.ref }}-${{ hashFiles('citare/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-homelab-parity-${{ steps.pin.outputs.ref }}-
            ${{ runner.os }}-homelab-parity-

      - name: Cache the stare.pub sample
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: citation-bench/.cache/stare
          key: stare-pub-${{ hashFiles('citation-bench/corpora/stare-pub-*.json') }}

      # The release before this one, by version, and its saved runs if it has them.
      - name: Fetch the previous release's runs
        id: previous
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ runner.temp }}/previous
        run: |
          prev=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "$TAG"; } | sort -uV | grep -B1 -xF "$TAG" | head -n -1)
          if [[ -z "$prev" ]]; then
            echo "note=No release before $TAG to compare with." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$DIR"
          if gh release download "$prev" -R "$GITHUB_REPOSITORY" -D "$DIR" \
              -p citare-corpus-10pct.json.gz -p citare-vectors.json.gz; then
            gunzip -c "$DIR/citare-corpus-10pct.json.gz" > "$DIR/corpus-10pct.json"
            gunzip -c "$DIR/citare-vectors.json.gz" > "$DIR/vectors.json"
          else
            echo "note=$prev has no saved benchmark runs attached, so there is nothing to compare $TAG with. Run this workflow on $prev to backfill them." >> "$GITHUB_OUTPUT"
          fi
          if gh release download "$prev" -R "$GITHUB_REPOSITORY" -D "$DIR" -p 'citare-stare-pub-*.json.gz'; then
            for f in "$DIR"/citare-stare-pub-*.json.gz; do
              name=$(basename "$f" .json.gz)
              gunzip -c "$f" > "$DIR/${name#citare-}.json"
            done
          fi

      # The ratchet is informational here: the tag is already cut.
      - name: Run the conformance vectors
        working-directory: citation-bench
        run: mise run bench:citare --save results/vectors/citare.json --label "$CITARE_LABEL" || true

      - name: Report on the stare.pub sample and the ten-percent sample
        working-directory: citation-bench
        env:
          PREVIOUS_NOTE: ${{ steps.previous.outputs.note || 'No earlier release to compare with.' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          start=$SECONDS
          mise run report:citare --size 10 --previous "$RUNNER_TEMP/previous" \
            --previous-note "$PREVIOUS_NOTE" --link "$RUN_URL" --out reports/release
          # Speed depends on the machine. Name it, since the stored eyecite runs weren't timed on it.
          cpu=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -1)
          runner="Runner: \`$RUNNER_NAME\` (homelab, ${cpu:-unknown CPU}, $(nproc) CPUs). eyecite's stored runs are timed on homelab too. Release runs attached before v0.5.1 were timed on GitHub-hosted runners, so speed comparisons with those cross machine types."
          for f in bench-report.md; do printf '\n%s\n' "$runner" >> "reports/release/$f"; done
          echo "report: $(( SECONDS - start )) s" >> "$RUNNER_TEMP/timing.txt"
          cat reports/release/bench-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run the one-percent sample
        working-directory: citation-bench
        run: |
          start=$SECONDS
          mise run corpus:run citare --corpus eyecite-sample --size 1
          echo "one-percent run: $(( SECONDS - start )) s" >> "$RUNNER_TEMP/timing.txt"

      - name: Collect the assets
        working-directory: citation-bench
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          cp reports/release/bench-report.md reports/release/headline.md "$RUNNER_TEMP/assets/"
          cp reports/release/summary.json "$RUNNER_TEMP/assets/bench-summary.json"
          gzip -9c results/vectors/citare.json > "$RUNNER_TEMP/assets/citare-vectors.json.gz"
          gzip -9c results/corpus-1pct/citare.json > "$RUNNER_TEMP/assets/citare-corpus-1pct.json.gz"
          gzip -9c results/corpus-10pct/citare.json > "$RUNNER_TEMP/assets/citare-corpus-10pct.json.gz"
          for f in results/stare-pub-*/citare.json; do
            gzip -9c "$f" > "$RUNNER_TEMP/assets/citare-$(basename "$(dirname "$f")").json.gz"
          done
          { echo; echo '```'; cat "$RUNNER_TEMP/timing.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$RUNNER_TEMP/assets"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bench-${{ inputs.tag }}
          path: ${{ runner.temp }}/assets/
          retention-days: 1

  # Holds the write token, and runs none of the benchmarked code, so a GitHub-hosted
  # runner does.
  publish:
    name: Attach to ${{ inputs.tag }}
    needs: bench
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bench-${{ inputs.tag }}
          path: assets

      - name: Upload the assets
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            assets/bench-report.md assets/bench-summary.json assets/citare-*.json.gz

      # Replaces the block between the markers, so a rerun doesn't stack a second one.
      - name: Add the headline to the release notes
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body \
            | sed '/<!-- citare-bench:start -->/,/<!-- citare-bench:end -->/d' > notes.md
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          {
            echo
            echo "<!-- citare-bench:start -->"
            echo "### Benchmark"
            echo
            cat assets/headline.md
            echo
            echo "Full report: [bench-report.md]($url/bench-report.md). The saved runs are attached for diffing against later releases (citation-bench's \`bench/diff.py\`)."
            echo "<!-- citare-bench:end -->"
          } >> notes.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
