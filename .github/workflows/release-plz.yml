name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tags and cuts a GitHub release once a release PR lands. Nothing goes
  # to crates.io: citare is consumed as a git dependency pinned by tag, so
  # release-plz.toml sets `git_only` and `publish = false`, and only
  # citare-core creates the one workspace tag `vX.Y.Z` and its release.
  # A no-op on any push that isn't a merged release PR.
  release:
    name: Release
    runs-on: homelab
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
      # `release` looks up the PR each commit came from
      # (GET /commits/{sha}/pulls); without this it fails with 403.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: ./.github/actions/homelab-setup
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The workspace tag, which only citare-core creates; empty when nothing released.
      - name: Read the release tag
        id: tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          echo "tag=$(jq -r '[.[]? | select(.package_name == "citare-core")][0].tag // empty' <<<"${RELEASES:-[]}")" >> "$GITHUB_OUTPUT"

  # Benchmarks the new tag and attaches the report to its release (#35). A release
  # cut with GITHUB_TOKEN triggers no `release: published` workflow, so it hangs off
  # this one. The write token stays in bench-release.yml's publish job; the job that
  # builds and runs citare only reads.
  bench:
    name: Release benchmark
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/bench-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # Opens or refreshes the release PR: the workspace version bump and the
  # CHANGELOG.md entry. GitHub refuses the PR unless the repo allows
  # Actions to create pull requests, which codexpublicus/infra sets
  # (`release_bot: true`). A PR opened with GITHUB_TOKEN triggers no
  # workflows, so CI doesn't run on the release PR itself.
  release-pr:
    name: Release PR
    runs-on: homelab
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: ./.github/actions/homelab-setup
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
