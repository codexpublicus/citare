name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tags and cuts a GitHub release once a release PR lands. Nothing goes
  # to crates.io: citare is consumed as a git dependency pinned by tag, so
  # release-plz.toml sets `git_only` and `publish = false`, and only
  # citare-core creates the one workspace tag `vX.Y.Z` and its release.
  # A no-op on any push that isn't a merged release PR. Both jobs run only in
  # codexpublicus/citare, on GitHub-hosted runners: push to main is the only
  # trigger, so no fork PR starts them, and a fork's own main skips them.
  release:
    name: Release
    if: github.repository == 'codexpublicus/citare'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
      # `release` looks up the PR each commit came from
      # (GET /commits/{sha}/pulls); without this it fails with 403.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The workspace tag, which only citare-core creates; empty when nothing released.
      - name: Read the release tag
        id: tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          echo "tag=$(jq -r '[.[]? | select(.package_name == "citare-core")][0].tag // empty' <<<"${RELEASES:-[]}")" >> "$GITHUB_OUTPUT"

  # Benchmarks the new tag and attaches the report to its release (#35). A release
  # cut with GITHUB_TOKEN triggers no `release: published` workflow, so it hangs off
  # this one. The write token stays in bench-release.yml's publish job; the job that
  # builds and runs citare only reads.
  bench:
    name: Release benchmark
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/bench-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # Opens or refreshes the release PR: the workspace version bump and the
  # CHANGELOG.md entry. It pushes the branch and opens the PR with the yeet
  # GitHub App's token, so CI runs on the release PR like any other; GitHub
  # holds the checks on a PR that GITHUB_TOKEN opens until someone approves
  # them. YEET_APP_ID (a variable, the App's client ID) and
  # YEET_APP_PRIVATE_KEY (a secret) are pushed by codexpublicus/infra
  # (yeet.py), and the App's installation must list this repo. The App is
  # required: a missing value, or a token that won't mint (the App not
  # installed here), fails the job. There is no GITHUB_TOKEN fallback,
  # because codexpublicus/infra turns off Actions' permission to create pull
  # requests in this repo (`release_bot: false`). The release job keeps
  # GITHUB_TOKEN: its tag and release start no workflows and open no PR, and
  # the bench job above is chained to it instead.
  release-pr:
    name: Release PR
    if: github.repository == 'codexpublicus/citare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Require the yeet App
        env:
          APP_ID: ${{ vars.YEET_APP_ID }}
          HAS_KEY: ${{ secrets.YEET_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error title=yeet App not configured::YEET_APP_ID (variable) or YEET_APP_PRIVATE_KEY (secret) is missing. codexpublicus/infra's yeet module (pulumi/codexpublicus_infra/yeet.py) sets both; run its Pulumi stack for this repo. The release PR is opened only with the App's token."
            exit 1
          fi
      - name: Generate the yeet App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YEET_APP_ID }}
          private-key: ${{ secrets.YEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Explain a token that wouldn't mint
        if: failure() && steps.app-token.outcome == 'failure'
        run: |
          echo "::error title=yeet App token::The yeet App's values are set, but no token minted. Add ${GITHUB_REPOSITORY} under Repository access in the App's settings, or check that YEET_APP_PRIVATE_KEY matches the App."
          exit 1
      # Any git push release-plz makes goes out with the checkout's
      # credentials, so the checkout takes the same token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
