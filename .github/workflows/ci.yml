name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown -p citare-wasm

      # The small module that loads the data bundle at runtime (docs/data-bundle.md).
      - name: Build WASM without embedded data
        run: cargo build --release --target wasm32-unknown-unknown -p citare-wasm --no-default-features

  # Conformance ratchet (#12): citation-bench's vectors against this checkout. Fails on
  # any vector that isn't in citation-bench's baselines/citare.known-failures, and lists
  # the listed ones that now pass, so the baseline only shrinks.
  #
  # citation-bench is pinned to CITATION_BENCH_REF, so a new vector or a rebaselined
  # known-failures file can't break this job unannounced. To bump it, take a commit from
  # citation-bench's main, run `CITARE_PATH=<this checkout> mise run bench:citare` in
  # citation-bench at that commit, and update CITATION_BENCH_REF here (full SHA) in its
  # own PR.
  parity:
    name: Parity (citation-bench)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CITATION_BENCH_REF: e6749c825108fc2e8cf02767a0028c9661f7c917
      # The deploy key comes from codexpublicus/infra. Until it exists the job skips
      # rather than failing; a secret can't be tested in `if:` directly.
      HAS_BENCH_KEY: ${{ secrets.CITATION_BENCH_DEPLOY_KEY != '' }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/citation-bench
    steps:
      - name: Skip without the citation-bench deploy key
        if: env.HAS_BENCH_KEY != 'true'
        run: |
          msg="CITATION_BENCH_DEPLOY_KEY is not set, so the citation-bench parity check was skipped. codexpublicus/infra provisions it."
          echo "::notice title=Parity skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_BENCH_KEY == 'true'
        with:
          path: citare
          submodules: recursive

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_BENCH_KEY == 'true'
        with:
          repository: codexpublicus/citation-bench
          ref: ${{ env.CITATION_BENCH_REF }}
          ssh-key: ${{ secrets.CITATION_BENCH_DEPLOY_KEY }}
          persist-credentials: false
          path: citation-bench

      # Python, uv and Rust at the versions citation-bench's .mise/config.toml pins.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        if: env.HAS_BENCH_KEY == 'true'
        with:
          working_directory: citation-bench

      - name: Cache cargo
        if: env.HAS_BENCH_KEY == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            citation-bench/target
          key: ${{ runner.os }}-parity-${{ env.CITATION_BENCH_REF }}-${{ hashFiles('citare/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-parity-${{ env.CITATION_BENCH_REF }}-
            ${{ runner.os }}-parity-

      # The adapter's Cargo.toml names citare by its git URL, and cargo fetches that
      # source even when CITARE_PATH patches it with this checkout. The job's own
      # read-only token covers the fetch.
      - name: Run the conformance vectors
        if: env.HAS_BENCH_KEY == 'true'
        working-directory: citation-bench
        env:
          CITARE_PATH: ${{ github.workspace }}/citare
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/codexpublicus/citare.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/codexpublicus/citare
        run: |
          set -o pipefail
          status=0
          mise run bench:citare 2>&1 | tee "$RUNNER_TEMP/bench.log" || status=$?
          {
            echo "## citation-bench parity"
            echo
            echo "citation-bench \`${CITATION_BENCH_REF:0:12}\`: $(grep -m1 'vectors pass' "$RUNNER_TEMP/bench.log" || echo 'no score line')"
            regressions=$(grep '^REGRESSION: ' "$RUNNER_TEMP/bench.log" || true)
            fixed=$(sed -n 's/^newly passing (remove from known failures): //p' "$RUNNER_TEMP/bench.log")
            if [[ -n "$regressions" ]]; then
              echo
              echo "### Regressions"
              echo
              sed 's/^REGRESSION: /- /' <<<"$regressions"
            fi
            if [[ -n "$fixed" ]]; then
              echo
              echo "### Newly passing"
              echo
              echo "Remove these from citation-bench's \`baselines/citare.known-failures\`:"
              echo
              sed 's/^/- `/; s/$/`/' <<<"$fixed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
