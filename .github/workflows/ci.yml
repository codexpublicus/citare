name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown -p citare-wasm

  # Conformance ratchet (#12) and benchmark report (#35). The ratchet runs
  # citation-bench's vectors against this checkout and fails on any vector that isn't in
  # citation-bench's baselines/citare.known-failures, listing the listed ones that now
  # pass so the baseline only shrinks. It is the job's only pass/fail gate.
  #
  # The report then runs citare over the one-percent CourtListener sample and compares
  # it with eyecite (citation-bench's stored run, so eyecite itself doesn't run here)
  # and with the last release's saved run, when that release has one attached. It goes
  # to the job summary and the bench-report artifact, and the bench-comment job posts
  # it on the PR. Nothing in it fails the build.
  #
  # citation-bench is pinned in .github/citation-bench-ref, so a new vector, a
  # rebaselined known-failures file or a new report can't change this job unannounced.
  # To bump it, take a commit from citation-bench's main, run
  # `CITARE_PATH=<this checkout> mise run bench:citare` in citation-bench at that
  # commit, and update the file in its own PR.
  parity:
    name: Parity (citation-bench)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The deploy key comes from codexpublicus/infra. Until it exists the job skips
      # rather than failing; a secret can't be tested in `if:` directly.
      HAS_BENCH_KEY: ${{ secrets.CITATION_BENCH_DEPLOY_KEY != '' }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/citation-bench
    steps:
      - name: Skip without the citation-bench deploy key
        if: env.HAS_BENCH_KEY != 'true'
        run: |
          msg="CITATION_BENCH_DEPLOY_KEY is not set, so the citation-bench parity check was skipped. codexpublicus/infra provisions it."
          echo "::notice title=Parity skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_BENCH_KEY == 'true'
        with:
          path: citare
          submodules: recursive
          persist-credentials: false

      - name: Read the citation-bench pin
        if: env.HAS_BENCH_KEY == 'true'
        id: pin
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ref=$(grep -v '^#' citare/.github/citation-bench-ref | tr -d '[:space:]')
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.github/citation-bench-ref isn't a full SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # Names this run in the report: citare-pr<N>-<commit>, or citare-<commit> on main.
          echo "CITARE_LABEL=citare-${PR:+pr$PR-}${HEAD_SHA:0:7}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_BENCH_KEY == 'true'
        with:
          repository: codexpublicus/citation-bench
          ref: ${{ steps.pin.outputs.ref }}
          ssh-key: ${{ secrets.CITATION_BENCH_DEPLOY_KEY }}
          persist-credentials: false
          path: citation-bench

      # Python, uv and Rust at the versions citation-bench's .mise/config.toml pins.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        if: env.HAS_BENCH_KEY == 'true'
        with:
          working_directory: citation-bench

      - name: Cache cargo
        if: env.HAS_BENCH_KEY == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            citation-bench/target
          key: ${{ runner.os }}-parity-${{ steps.pin.outputs.ref }}-${{ hashFiles('citare/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-parity-${{ steps.pin.outputs.ref }}-
            ${{ runner.os }}-parity-

      # The adapter's Cargo.toml names citare by its git URL, and cargo fetches that
      # source even when CITARE_PATH patches it with this checkout. The job's own
      # read-only token covers the fetch.
      - name: Run the conformance vectors
        if: env.HAS_BENCH_KEY == 'true'
        id: vectors
        working-directory: citation-bench
        env:
          CITARE_PATH: ${{ github.workspace }}/citare
          CITATION_BENCH_REF: ${{ steps.pin.outputs.ref }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/codexpublicus/citare.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/codexpublicus/citare
        run: |
          set -o pipefail
          status=0
          mise run bench:citare --save results/vectors/citare.json --label "$CITARE_LABEL" 2>&1 | tee "$RUNNER_TEMP/bench.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "## citation-bench parity"
            echo
            echo "citation-bench \`${CITATION_BENCH_REF:0:12}\`: $(grep -m1 'vectors pass' "$RUNNER_TEMP/bench.log" || echo 'no score line')"
            regressions=$(grep '^REGRESSION: ' "$RUNNER_TEMP/bench.log" || true)
            fixed=$(sed -n 's/^newly passing (remove from known failures): //p' "$RUNNER_TEMP/bench.log")
            if [[ -n "$regressions" ]]; then
              echo
              echo "### Regressions"
              echo
              sed 's/^REGRESSION: /- /' <<<"$regressions"
            fi
            if [[ -n "$fixed" ]]; then
              echo
              echo "### Newly passing"
              echo
              echo "Remove these from citation-bench's \`baselines/citare.known-failures\`:"
              echo
              sed 's/^/- `/; s/$/`/' <<<"$fixed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The last release's saved runs, which the release benchmark attaches as assets.
      - name: Fetch the last release's runs
        if: env.HAS_BENCH_KEY == 'true'
        id: previous
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ runner.temp }}/previous
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p "$DIR"
          if gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$DIR" \
              -p citare-corpus-1pct.json.gz -p citare-vectors.json.gz; then
            gunzip -c "$DIR/citare-corpus-1pct.json.gz" > "$DIR/corpus-1pct.json"
            gunzip -c "$DIR/citare-vectors.json.gz" > "$DIR/vectors.json"
          else
            echo "note=$tag has no saved benchmark runs attached, so there is nothing to compare it with. The Release benchmark workflow attaches them (run it on $tag to backfill)." >> "$GITHUB_OUTPUT"
          fi

      - name: Benchmark report
        if: env.HAS_BENCH_KEY == 'true'
        id: report
        continue-on-error: true
        working-directory: citation-bench
        env:
          CITARE_PATH: ${{ github.workspace }}/citare
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/codexpublicus/citare.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/codexpublicus/citare
          PREVIOUS_NOTE: ${{ steps.previous.outputs.note || 'No earlier release to compare with.' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          start=$SECONDS
          mise run report:citare --size 1 --previous "$RUNNER_TEMP/previous" \
            --previous-note "$PREVIOUS_NOTE" --link "$RUN_URL" --out reports/citare
          echo "Report: $(( SECONDS - start )) s, from the eyecite restore to the Markdown." >> reports/citare/timing.txt
          cat reports/citare/bench-report.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reports/citare/runs
          cp results/vectors/citare.json reports/citare/runs/citare-vectors.json
          cp results/corpus-1pct/citare.json reports/citare/runs/citare-corpus-1pct.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.report.outcome == 'success'
        with:
          name: bench-report
          path: citation-bench/reports/citare/
          retention-days: 30

      - name: Fail on regressions
        if: env.HAS_BENCH_KEY == 'true'
        env:
          STATUS: ${{ steps.vectors.outputs.status }}
        run: exit "${STATUS:-1}"

  # Posts the report as one PR comment and edits it on later pushes. Kept apart from
  # parity so the job that builds and runs PR code never holds a write token. Same-repo
  # PRs only: a fork's token can't comment, and a public repo would want citation-bench
  # #8's workflow_run split instead.
  bench-comment:
    name: Benchmark comment
    needs: parity
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.parity.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: download
        continue-on-error: true
        with:
          name: bench-report
          path: report

      - name: Post or update the comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: "<!-- citare-bench-report -->"
        run: |
          { echo "$MARKER"; cat report/comment.md; } > body.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | head -1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md > /dev/null
            echo "updated comment $id"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md > /dev/null
            echo "posted a new comment"
          fi
