name: Homelab runner setup
description: >-
  Installs what the homelab runner image lacks for a Rust build: a C toolchain
  (cargo links with cc, and build scripts compile with it) and pkg-config. The image
  is actions-runner plus gh, git, curl and jq; rustup, mise and uv come from their
  own actions.

inputs:
  packages:
    description: Extra apt packages, space-separated
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install build packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        missing=()
        for p in build-essential pkg-config $PACKAGES; do
          dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || missing+=("$p")
        done
        if (( ${#missing[@]} == 0 )); then
          echo "build packages already installed"
          exit 0
        fi
        if [[ "$(id -u)" == 0 ]]; then
          sudo=()
        elif sudo -n true 2>/dev/null; then
          sudo=(sudo -n)
        else
          echo "::error::the runner user can't sudo without a password, so ${missing[*]} can't be installed; add them to the runner image"
          exit 1
        fi
        "${sudo[@]}" env DEBIAN_FRONTEND=noninteractive apt-get update -q
        "${sudo[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends "${missing[@]}"
